services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    #ports:
      # <Host Port>:<Container Port>
      #- "3001:3001"
    networks:
      - nginx-net

networks:
  nginx-net:
    external: true

