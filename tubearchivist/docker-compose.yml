services:
  tubearchivist:
    container_name: tubearchivist
    restart: unless-stopped
    image: bbilly1/tubearchivist
    #ports:
    #  - 8000:8000
    volumes:
      - ./media:/youtube
      - ./cache:/cache
    environment:
      - ES_URL=http://archivist-es:9200     # needs protocol e.g. http and port
      - REDIS_CON=redis://archivist-redis:6379
      - HOST_UID=1000
      - HOST_GID=1000
      - TA_HOST=https://tubearchivist.zupke.xyz  # set your host name with protocol and port
      - TA_USERNAME=${USERNAME}                  # your initial TA credentials
      - TA_PASSWORD=${PASSWORD}                  # your initial TA credentials
      - ELASTIC_PASSWORD=${ENV_ELASTIC_PASSWORD} # set password for Elasticsearch
      - TZ=America/Los_Angeles                   # set your time zone
    networks:
      - tubearchivist-internal
      - nginx-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - archivist-es
      - archivist-redis
  archivist-redis:
    image: redis
    container_name: archivist-redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - ./data/redis:/data
    networks:
      - tubearchivist-internal
    depends_on:
      - archivist-es
  archivist-es:
    #image: bbilly1/tubearchivist-es         # only for amd64, or use official es 8.18.2
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.7 #use version 8, and the official image for arm64 support
    container_name: archivist-es
    restart: unless-stopped
    environment:
      - "ELASTIC_PASSWORD=${ENV_ELASTIC_PASSWORD}"       # matching Elasticsearch password
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - "xpack.security.enabled=true"
      - "discovery.type=single-node"
      - "path.repo=/usr/share/elasticsearch/data/snapshot"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ./data/es:/usr/share/elasticsearch/data    # check for permission error when using bind mount, see readme
    expose:
      - "9200"
    networks:
      - tubearchivist-internal

#volumes:
  #media:
  #cache:
  #redis:
  #es:

networks:
  tubearchivist-internal:
  nginx-net:
    external: true
