services:
  yamtrack:
    container_name: yamtrack
    image: ghcr.io/fuzzygrim/yamtrack
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - TZ=America/Los_Angeles
      - SECRET=${YAMTRACK_SECRET}
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./db:/yamtrack/db
    ports:
      - "8000:8000" # leave this open even with docker networking for Plex webhooks
    networks:
      - yamtrack-internal
      - nginx-net

  redis:
    container_name: yamtrack-redis
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - yamtrack-internal

volumes:
  redis_data:

networks:
  yamtrack-internal:
  nginx-net:
    external: true
